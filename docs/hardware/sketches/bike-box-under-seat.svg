  <text x="32" y="36" font-size="18" font-weight="700" fill="#1a1a1a">Seat</text>
  <text x="86" y="36" font-size="14" fill="#1a1a1a">The box straps in the space under this seat.</text>
  <text x="32" y="58" font-size="13" fill="#1a1a1a">Build this one first. Bluetooth only. Radio socket stays empty.</text>

  <text x="214" y="112" font-size="14" font-weight="700" fill="#1a1a1a">within 15 cm of the positive post</text>
  <line x1="168" y1="124" x2="214" y2="124" stroke="#9b1c1c" stroke-width="1.5"/>
  <line x1="168" y1="118" x2="168" y2="130" stroke="#9b1c1c" stroke-width="1.5"/>
  <line x1="214" y1="118" x2="214" y2="130" stroke="#9b1c1c" stroke-width="1.5"/>

  <rect x="36" y="148" width="150" height="112" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <circle cx="168" cy="148" r="8" fill="#9b1c1c"/>
  <circle cx="168" cy="260" r="8" fill="#1a1a1a"/>
  <text x="156" y="140" font-size="14" font-weight="700" fill="#9b1c1c">+</text>
  <text x="146" y="252" font-size="14" font-weight="700" fill="#1a1a1a">-</text>
  <text x="52" y="196" font-size="16" font-weight="700" fill="#1a1a1a">Battery</text>
  <text x="52" y="218" font-size="13" fill="#1a1a1a">under the seat</text>

  <line x1="176" y1="148" x2="214" y2="148" stroke="#9b1c1c" stroke-width="3.2"/>
  <rect x="214" y="128" width="120" height="40" rx="4" fill="#ffffff" stroke="#9b1c1c" stroke-width="2"/>
  <text x="238" y="154" font-size="16" font-weight="700" fill="#1a1a1a">1 A fuse</text>

  <line x1="334" y1="148" x2="520" y2="178" stroke="#9b1c1c" stroke-width="3.2"/>
  <text x="360" y="142" font-size="13" font-weight="700" fill="#1a1a1a">18 AWG red</text>

  <line x1="176" y1="260" x2="524" y2="260" stroke="#1a1a1a" stroke-width="3.2"/>
  <circle cx="524" cy="260" r="3.5" fill="#1a1a1a"/>
  <text x="200" y="232" font-size="13" font-weight="700" fill="#1a1a1a">18 AWG black, to the negative post</text>

  <rect x="508" y="150" width="286" height="156" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
