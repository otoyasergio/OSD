  <circle cx="520" cy="162" r="2.6" fill="#1a1a1a"/>
  <circle cx="782" cy="162" r="2.6" fill="#1a1a1a"/>
  <circle cx="520" cy="294" r="2.6" fill="#1a1a1a"/>
  <circle cx="782" cy="294" r="2.6" fill="#1a1a1a"/>
  <text x="534" y="188" font-size="16" font-weight="700" fill="#1a1a1a">Gasketed box</text>
  <text x="534" y="210" font-size="14" fill="#1a1a1a">XIAO nRF52840</text>
  <text x="534" y="230" font-size="14" fill="#1a1a1a">TPS7A1601, MCP2515,</text>
  <text x="534" y="250" font-size="14" fill="#1a1a1a">SN65HVD230</text>
  <text x="534" y="272" font-size="14" fill="#1a1a1a">Radio socket empty</text>

  <circle cx="651" cy="306" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
