name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

      - name: Install Playwright browsers
        # WebKit backs the Safari/iOS layout gates in safari-mobile.spec.ts.
        run: npx playwright install --with-deps chromium webkit

      - name: E2E smoke
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          CI: true

  integration:
    name: Integration (isolated Supabase)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Export isolated database credentials
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY|ANON_KEY)=')"
          {
            echo "TEST_SUPABASE_URL=$API_URL"
            echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "TEST_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Integration tests
        run: npm run test:integration

      - name: Create mutation guard secret
        run: echo "E2E_ENV_GUARD_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Build Next against isolated Supabase
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          PHOTO_UPLOAD_QUEUE_ENABLED: "1"
          CHECKOUT_EVIDENCE_ENABLED: "1"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Stateful Safari photo reliability
        run: npm run test:e2e:safari-photo
        env:
          CI: true
          E2E_ALLOW_MUTATION: "1"
          E2E_ENV_GUARD_SECRET: ${{ env.E2E_ENV_GUARD_SECRET }}
          TEST_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          PHOTO_UPLOAD_QUEUE_ENABLED: "1"
          CHECKOUT_EVIDENCE_ENABLED: "1"
          OPENAI_API_KEY: ""
          TWILIO_ACCOUNT_SID: ""
          TWILIO_AUTH_TOKEN: ""
          TWILIO_API_KEY_SID: ""
          TWILIO_API_KEY_SECRET: ""
          TWILIO_MESSAGING_SERVICE_SID: ""
          TWILIO_FROM_NUMBER: ""
          TWILIO_TWIML_APP_SID: ""
          RESEND_API_KEY: ""

      - name: Database lint
        run: supabase db lint || true

      - name: Stop Supabase
        if: always()
        run: supabase stop
